# 发布流水线:在 GitHub 页面发布 Release(publish)时自动触发。
# 三平台原生 runner 构建 self-contained 产物,统一附加到该 Release:
#   Windows x64/arm64 → zip
#   macOS   x64/arm64 → tar.gz + dmg(未签名/未公证;Unix 可执行位在原生 runner 上保留)
#   Linux   x64/arm64 → tar.gz + AppImage + deb + rpm(后三者均未签名;四种格式全部在同一台
#                       x64 runner 上交叉打包出 amd64/arm64 两份,理由见各自的打包脚本:
#                       build/appimage/ 与 build/linux-packages/)
# 随包分发的插件(plugins/<目录名>/,目录名 = id 把点换成短横,原因见 macOS job 的签名一步)
# **只有本仓库 plugins/ 下自建的那些**(当前是 AI 插件 velashell.ai),随 publish 一起构建、
# 由 src/VelaShell/VelaShell.csproj 的 AddVelaPluginsToPublish 登记入包。
# 哪个进包由各插件的 <VelaPluginShip> 把关(示例插件 velashell.hello-world 设为 false,
# 只作开发范例不进产物)。
# 2026-08-22 起**不再**从第一方插件仓库 VelaShellLabs/velashell-plugins 取 Redis / S3 / Telnet 预装:
# 不是每个人都要连 Redis、开 S3、拨 Telnet,预装等于给所有人塞三份用不上的依赖(光 Redis 与
# S3 的 SDK 就近 5 MB),还把发布节奏绑在另一个仓库的发版顺序上。它们改由用户按需从插件商店
# (https://market.easilynet.top)自行安装 —— 插件管理页的安装入口旁就有链接。
# 联调/本机想要那几个插件时,自己把插件目录铺进 artifacts/plugins/ 即可(见
# src/VelaShell/VelaShell.csproj 的 VelaPluginsStageDir),流水线不碰这个目录。
# 另有 build-msix 任务产出商店版 .msixbundle,但它不附加到 Release —— 作为工作流
# artifact(store-msix)留存,由人工下载后提交 Partner Center。便携版与商店版是同一份二进制,
# 只是容器不同;应用内自更新在商店版会自动关闭(运行时判定包身份,见 Services/AppPackaging.cs)。
# macOS 双产物分工(动 latest.json 前先读这段):
#   tar.gz — 应用内自更新器的资产,latest.json 只指向它。更新器是"原地换版"
#            (zip/tar 按相对路径解进应用目录),不认识 dmg。
#   注意 self-contained(而非 single-file)是自更新方案的前提:换版由应用退出后才动手的外置
#   进程执行,跑的就是暂存目录里解包出来的那份新版应用 —— 它自成一体、无需安装即可运行,
#   靠的正是 self-contained。2026-08-12 起刻意不再单文件发布(隔离插件的 PluginHost 需要
#   磁盘上的真实可执行体,详见 src/VelaShell/VelaShell.csproj),换版也随之从"移动"改为"复制"。
#   dmg    — 人类安装资产:VelaShell.app 拖进 /Applications。.app 的 Contents/MacOS
#            就是 tar.gz 的扁平布局,应用在 bundle 内运行时更新器的应用目录即
#            Contents/MacOS,后续自更新照常工作(Info.plist/图标不随更新变,可接受)。
#   因此 dmg 绝不能写进 latest.json 的 assets;二者布局必须保持一致。
# Linux 一共四种产物,分工同理:只有 tar.gz 是更新器资产、进 latest.json;AppImage / deb / rpm
# 都是给人下载安装的。后三者装完之后应用目录要么是只读 squashfs 挂载点、要么归 root,
# 应用内更新器的可写探测会自动把关于页降级成"发现新版本,请手动下载",无需为它们加任何判定。
# 另生成两份元数据:
#   SHA256SUMS.txt — 全部产物的校验和(人工核对用)
#   latest.json    — 应用内自更新清单(版本号/标签/各 RID 产物名+sha256+大小);
#                    应用经 releases/latest/download/latest.json 固定地址读取(stable 通道,
#                    不占 API 配额),preview 通道经 API 定位 Release 后取同名清单。
# 版本号取 Release 标签(去掉前缀 v),经 -p:Version 覆盖 Directory.Build.props,
# 关于页显示与产物命名自动一致 —— 发新版只需打标签发 Release,无需改代码。
#
# 2026-08-07 排障留痕:发布 1.1.2 时本工作流一个 run 都没产生,YAML 本身没问题(同一份文件
# 8/4 还成功产出过 1.1.1 的全部资产)。当时的现象与已排除的因素:
#   · Release 正常:draft=false、prerelease=false,仓库事件流里 ReleaseEvent/published 确实发出;
#   · 工作流文件自 2026-07-26 起一直在默认分支 main 上,期间无提交改动、无强推、无迁移;
#   · 但工作流对象曾被置为 state=deleted(deleted 状态收不到任何事件 → 静默不跑、无失败记录);
#     推一次改动到 main 会重新索引,状态已回 active —— 然而再次发布仍然 0 run;
#   · 同期仓库的 run 历史 / artifact / cache 全部归零,而账号下其他仓库的 Actions 一切正常。
# 即:事件在发、工作流是 active,Actions 却不建 run,已超出仓库配置能解释的范围(疑为 GitHub 侧
# 对本仓库的 Actions 数据做过重置/压制)。自查顺序:
#   gh api repos/joesdu/VelaShell/actions/workflows/release.yml --jq .state   # 期望 active
#   gh api repos/joesdu/VelaShell/actions/runs --jq .total_count              # 0 且状态 active → 看 Actions 页面横幅
# 兜底见下方 workflow_dispatch:能手动跑通就说明只是 release 事件没送达,跑不动则是仓库级封锁,
# 需要开 GitHub support ticket。
name: Release

on:
  release:
    types: [published]
  # 手动兜底:release 事件没能触发时(2026-08-07 就遇到过一次),在 Actions 页面选本工作流
  # → Run workflow → 填标签(如 1.1.2)即可补跑。产物上传用的是 `gh release upload --clobber`,
  # 对同一标签重复跑是幂等的,不会产生重复资产。标签必须已存在且对应 Release 已发布。
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并回传产物的 Release 标签(如 1.1.2)'
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT: src/VelaShell/VelaShell.csproj

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore strong-name key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("src/VelaShell.snk",
            [Convert]::FromBase64String($env:SNK_B64))
        env:
          SNK_B64: ${{ secrets.STRONG_NAME_KEY }}
      - name: Publish (win-x64 / win-arm64)
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name || inputs.tag }}'.TrimStart('v')
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in @('win-x64', 'win-arm64')) {
            $name = "VelaShell-$version-$rid"
            dotnet publish $env:PROJECT -c Release -r $rid -o "out/$name" `
              -p:Version=$version -p:SelfContained=true `
              -p:DebugType=None --nologo
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Get-ChildItem "out/$name" -Recurse -File -Filter '*.pdb' | Remove-Item -Force
            Compress-Archive -Path "out/$name/*" -DestinationPath "dist/$name.zip" -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: dist/*
          if-no-files-found: error

  # 商店版:同一份源码、同一条发布命令,只是打进 MSIX 而非压成 zip。二者的行为差异
  # 全部由运行时的包身份判定驱动(Services/AppPackaging.cs),装成 MSIX 就自动关掉应用内
  # 自更新、改由商店接管,因此这里不需要任何特殊编译配置。
  # 产物刻意不签名:提交到商店的 MSIX 由微软在认证通过后用商店证书签名,自己签会被替换掉。
  # 包标识默认值即本产品在 Partner Center 的真实标识(非机密,商店包里人人可读),
  # 无需额外配置即可出可提交的包。如需改用别的产品(换账户/换产品条目),用仓库变量覆盖:
  #   vars.MSIX_IDENTITY_NAME          ← Package/Identity/Name
  #   vars.MSIX_PUBLISHER              ← Package/Identity/Publisher(形如 CN=<GUID>)
  #   vars.MSIX_PUBLISHER_DISPLAY_NAME ← Package/Properties/PublisherDisplayName
  # 三者填错时上传会被拒;脚本会就地算出包系列名(PFN)打印出来,与产品标识页一比即知。
  build-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore strong-name key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("src/VelaShell.snk",
            [Convert]::FromBase64String($env:SNK_B64))
        env:
          SNK_B64: ${{ secrets.STRONG_NAME_KEY }}
      - name: Build MSIX bundle (win-x64 + win-arm64)
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name || inputs.tag }}'.TrimStart('v')
          ./build/msix/Build-Msix.ps1 -Version $version `
            -IdentityName '${{ vars.MSIX_IDENTITY_NAME || 'B0B5EDED.VelaShell' }}' `
            -Publisher '${{ vars.MSIX_PUBLISHER || 'CN=3CDE21EE-6AB1-414B-BD2D-EDE8A225854B' }}' `
            -PublisherDisplayName '${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || '鹿宝丶' }}'
      # 单独上传,不并入 dist:.msixbundle 是给 Partner Center 手动提交用的,既不进
      # latest.json(那是便携版自更新器的清单),也不该被当成可下载的安装包挂在 Release 上。
      - uses: actions/upload-artifact@v7
        with:
          name: store-msix
          path: dist/*.msixbundle
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore strong-name key
        # openssl 在 Linux/macOS 上解码行为一致(避开 GNU/BSD base64 -d/-D 差异)
        run: echo "$SNK_B64" | openssl base64 -A -d > src/VelaShell.snk
        env:
          SNK_B64: ${{ secrets.STRONG_NAME_KEY }}
      # 腾磁盘。arm64 的 macOS runner 数据卷可用空间只有十几 GB,预装的多版本 Xcode 与模拟器
      # 运行时占掉大头,且不同批次镜像的剩余量差别很大 —— 这就是 dmg 打包间歇性
      # "No space left on device"、重跑又能过的原因(1.1.2 翻过一次,失败点在第一个 RID,
      # 说明是起步空间不够而非产物累积撑爆)。删掉用不上的预装组件把它变成确定行为。
      # 本 job 只用到 /usr/bin 下的 sips / iconutil / codesign / hdiutil,都是系统自带,
      # 不走 xcrun、不依赖 Xcode.app;仍保留 xcode-select 选中的那一份以防万一。
      # 刻意不加 set -e:腾空间是尽力而为,某个路径不存在或删不掉不该让发布失败。
      - name: Free up disk space
        run: |
          set -uo pipefail
          echo "== before =="; df -h /System/Volumes/Data | tail -1
          selected="$(cd "$(xcode-select -p)/../.." 2>/dev/null && pwd -P)" || selected=''
          for app in /Applications/Xcode*.app; do
            [ -e "$app" ] || continue
            real="$(cd "$app" 2>/dev/null && pwd -P)" || continue
            [ "$real" = "$selected" ] && continue
            sudo rm -rf "$app"
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator"
          sudo rm -rf "$HOME/Library/Android" /usr/local/share/boost
          sudo rm -rf "$HOME/.rustup" "$HOME/.cargo"
          echo "== after =="; df -h /System/Volumes/Data | tail -1
      - name: Publish (osx-x64 / osx-arm64)
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir -p dist

          # AppIcon.icns:从源 png 生成一次,两个 RID 共用。
          mkdir -p out/AppIcon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z "$size" "$size" src/VelaShell/Assets/velashell.png \
              --out "out/AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$((size * 2))" "$((size * 2))" src/VelaShell/Assets/velashell.png \
              --out "out/AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns out/AppIcon.iconset -o out/AppIcon.icns

          for rid in osx-x64 osx-arm64; do
            name="VelaShell-$version-$rid"
            dotnet publish "$PROJECT" -c Release -r "$rid" -o "out/$name" \
              -p:Version="$version" -p:SelfContained=true -p:DebugType=None --nologo
            # 两个可执行体:主程序,以及隔离插件的宿主进程(由主程序按需拉起)。
            chmod +x "out/$name/VelaShell" "out/$name/VelaShell.PluginHost"

            # tar.gz:应用内更新器的资产,扁平布局不可改(见文件头"macOS 双产物分工")。
            tar -czf "dist/$name.tar.gz" -C "out/$name" .

            # VelaShell.app:Contents/MacOS = 上面的扁平发布目录,布局与 tar.gz 严格一致,
            # 这样无论用户从 dmg 装进 /Applications 还是解 tar 便携运行,自更新走同一条原地换版路径。
            # 直接建在 dmg 根目录里,并且用 mv 而不是 cp —— 原先"发布目录 → .app → dmg 根目录"
            # 三份全量副本,叠上 hdiutil 那份等大的临时镜像就是四份,runner 磁盘扛不住。
            # tar.gz 此时已经打好,out/$name 没有别的用途,可以整个搬走(同卷 mv,零拷贝)。
            dmgroot="out/dmg-$rid"
            app="$dmgroot/VelaShell.app"
            mkdir -p "$app/Contents/Resources"
            mv "out/$name" "$app/Contents/MacOS"
            cp src/VelaShell/Info.plist "$app/Contents/Info.plist"
            # CFBundleShortVersionString 显示完整版本(含预发布后缀);CFBundleVersion 取纯数字段。
            /usr/libexec/PlistBuddy \
              -c "Set :CFBundleShortVersionString $version" \
              -c "Set :CFBundleVersion ${version%%-*}" \
              "$app/Contents/Info.plist"
            cp out/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
            printf 'APPL????' > "$app/Contents/PkgInfo"
            # ad-hoc 签名:Apple Silicon 拒绝运行完全无签名的二进制;无开发者证书时 ad-hoc 是底线。
            # 后续自更新替换 Contents/MacOS 里的文件会使 bundle 印章失效 —— 对未公证的
            # ad-hoc 应用无影响(系统只校验各二进制自身的嵌入签名,dotnet publish 的产物自带)。
            #
            # **--deep 在这套布局下是硬要求,别再想着去掉。** 1.4.8 试过一次,换来的是
            # "code object is not signed at all / In subcomponent: …/System.Diagnostics.Contracts.dll":
            # Contents/MacOS 在 bundle 格式里是**代码区**,里面除主可执行体之外的每个文件都算嵌套代码,
            # codesign 要求它们事先各自签好;而我们往那儿摊的是三百多个 dll/dylib,
            # 谁也不会挨个去签 —— --deep 干的正是这件事。苹果那句"--deep 不该用于签名"
            # 针对的是"应该把嵌套代码在各自的构建里签好"的项目,不是我们这种整包摊平的形态。
            # 这个布局本身不能动:Contents/MacOS 必须与 tar.gz 逐字节一致,自更新才走得通(见文件头)。
            #
            # --deep 的已知代价是下面这道闸挡着的那件事,读完再动这一段。
            #
            # --deep 会把包内每个"看着像 bundle"的目录当嵌套代码去解析,而**目录名里带点号就算**。
            # 撞上就是一句看不出该动哪里的 "bundle format unrecognized, invalid, or unsuitable":
            # 1.2.0 栽在插件目录名 velashell.ai 上(应对是改目录名,见 plugins/README.md),
            # 1.4.8 栽在 QRCoder → System.Drawing.Common 带进来的 runtimes/win/lib/net6.0/ 上
            # (应对是把 QRCoder 换成自研编码器,见 plugins/VelaShell.Plugin.Ai/Ui/QrCode.cs)。
            # 两次都是"新加一个依赖"引发的,而报错里完全看不出这层因果 —— 所以先自己扫一遍,
            # 把话说清楚再失败。目前包内 34 个目录一个带点号的都没有,这道闸平时不作声。
            dotted="$(find "$app" -mindepth 1 -type d -name '*.*')"
            if [ -n "$dotted" ]; then
              echo "::error::.app 内出现带点号的目录,codesign --deep 会把它当成嵌套 bundle 而失败:"
              echo "$dotted"
              echo "多半是新加的 NuGet 包带进来的 runtimes/<rid>/lib/<tfm>/。"
              echo "要么去掉那个依赖,要么在打 .app 之前把用不上的 runtimes 子树剪掉。"
              exit 1
            fi
            codesign --force --deep --sign - "$app"

            # dmg:VelaShell.app + /Applications 快捷方式的经典拖装布局。
            # hdiutil -srcfolder 会先建一个与内容等大的可写镜像(挂到 /Volumes/VelaShell)灌进去
            # 再转 UDZO,峰值需要"未压缩内容 + 压缩产物"的空间,是这个 job 里最吃磁盘的一步。
            ln -s /Applications "$dmgroot/Applications"
            hdiutil create -volname "VelaShell" -srcfolder "$dmgroot" -ov -format UDZO "dist/$name.dmg"

            # 立刻回收:两个 RID 之间不留全量副本,也不留只对上一个 RID 有意义的中间产物。
            rm -rf "$dmgroot"
            rm -rf src/*/obj/Release/*/"$rid" src/*/bin/Release/*/"$rid"
            echo "== after $rid =="; df -h /System/Volumes/Data | tail -1
          done
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: dist/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore strong-name key
        # openssl 在 Linux/macOS 上解码行为一致(避开 GNU/BSD base64 -d/-D 差异)
        run: echo "$SNK_B64" | openssl base64 -A -d > src/VelaShell.snk
        env:
          SNK_B64: ${{ secrets.STRONG_NAME_KEY }}
      # rpm:Debian 系上装个 rpmbuild 就能产出 rpm 包,不必再养一台 rpm 发行版的 runner。
      # imagemagick:仓库只有一张 1024×1024 的源图,而 hicolor 主题不认这个尺寸,
      #             deb/rpm 里的图标必须现降采样成标准档位(见 Stage-Payload.sh)。
      # 显式装而不是赌 runner 镜像自带:两者在 ubuntu 镜像的历次改版里都进出过。
      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm imagemagick
      - name: Publish & package (linux-x64 / linux-arm64 → tar.gz + AppImage + deb + rpm)
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          mkdir -p dist
          for rid in linux-x64 linux-arm64; do
            name="VelaShell-$version-$rid"
            dotnet publish "$PROJECT" -c Release -r "$rid" -o "out/$name" \
              -p:Version="$version" -p:SelfContained=true -p:DebugType=None --nologo
            # 两个可执行体:主程序,以及隔离插件的宿主进程(由主程序按需拉起)。
            chmod +x "out/$name/VelaShell" "out/$name/VelaShell.PluginHost"
            # tar.gz:应用内更新器的资产,扁平布局不可改(latest.json 只登记它)。
            tar -czf "dist/$name.tar.gz" -C "out/$name" .
            # AppImage:人类下载资产,与 macOS 的 dmg 同一定位 —— 单文件、免安装、双击即跑。
            # 同样**不进 latest.json**:更新器只会原地解包 zip/tar.gz;何况 AppImage 运行时应用
            # 目录是只读的 squashfs 挂载点,换版无从谈起(可写探测会自动降级成"请手动下载")。
            build/appimage/Build-AppImage.sh "out/$name" "$rid" "$version" dist
            # deb / rpm:发行版原生包,装进 /opt/velashell 并登记到菜单与 PATH。
            # 两者装进系统的文件是同一棵树(build/linux-packages/Stage-Payload.sh),只是外壳不同。
            # 命名刻意跟随各自发行版的惯例(velashell_1.2.3_amd64.deb / velashell-1.2.3-1.x86_64.rpm)
            # 而不是本仓库的 VelaShell-<版本>-<RID>:这两个文件名是给 dpkg/rpm 和仓库工具解析的,
            # 改成自定义样式会让它们认不出包名/版本/架构。同样不进 latest.json(装完目录归 root,
            # 更新交给包管理器)。
            build/linux-packages/Build-Deb.sh "out/$name" "$rid" "$version" dist
            build/linux-packages/Build-Rpm.sh "out/$name" "$rid" "$version" dist
            # 打完就回收:一份发布目录 200 MB 上下,两个 RID 之间不留全量副本。
            rm -rf "out/$name"
          done
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error

  attach-to-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          # 只收便携版产物:store-msix 是给 Partner Center 手动提交的,不能混进 Release 资产
          # (它未签名、装不上,还会污染 SHA256SUMS)。不加这道过滤就会被 merge-multiple 一并拉进来。
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Generate latest.json (in-app update manifest)
        run: |
          set -euo pipefail
          cd dist
          VERSION="${TAG_NAME#v}"
          assets='{}'
          add_asset() {
            local rid="$1" file="$2"
            local sha size
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            size=$(stat -c%s "$file")
            assets=$(jq --arg rid "$rid" --arg name "$file" --arg sha "$sha" --argjson size "$size" \
              '.[$rid] = {name: $name, sha256: $sha, size: $size}' <<< "$assets")
          }
          for rid in win-x64 win-arm64; do
            add_asset "$rid" "VelaShell-$VERSION-$rid.zip"
          done
          # macOS 固定登记 tar.gz —— 更新器只会原地解包 zip/tar.gz,dmg 是给人手动安装的,
          # 写进清单会让全体 mac 用户的应用内更新直接报"不支持的包格式"(见文件头)。
          for rid in osx-x64 osx-arm64 linux-x64 linux-arm64; do
            add_asset "$rid" "VelaShell-$VERSION-$rid.tar.gz"
          done
          jq -n --arg version "$VERSION" --arg tag "$TAG_NAME" --argjson assets "$assets" \
            '{version: $version, tag: $tag, assets: $assets}' > latest.json
          cat latest.json
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          # 对全部资产求和(排除清单自身,避免重定向先建出的空文件把自己算进去)
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec sha256sum {} + \
            | sed 's| \./| |' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload assets to release
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
